[project]
name = "metalearn-backend"
version = "0.1.0"
description = "MetaLearn FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.28",
    # 파싱 업로드 라우터가 UploadFile/Form을 쓴다. 없으면 **import 단계에서** 앱이
    # 통째로 죽는다(FastAPI가 라우트 등록 때 검사한다). 선언이 빠져 있어서
    # 클린 빌드가 안 됐다 — 로컬에 예전에 깔린 것으로 가려져 있었다.
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false
